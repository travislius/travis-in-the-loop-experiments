<!doctype html>
<html><head><meta charset="utf-8"><title>Ledgerly Expenses (sandbox)</title>
<style>
body{margin:0;font-family:Verdana,Arial,sans-serif;background:#e9edf2;color:#222;font-size:13px}
.top{background:#2d4a6b;color:#fff;padding:10px 18px;display:flex;gap:18px;align-items:center}
.top b{font-size:16px}.top a{color:#cfe0f5;text-decoration:none;cursor:pointer}
.wrap{display:flex;gap:16px;padding:16px}
.card{background:#fff;border:1px solid #c5ccd6;border-radius:4px;padding:16px}
.main{flex:1}.side{width:300px}
label{display:block;margin:10px 0 3px;font-weight:bold}
input,select,textarea{font-size:13px;padding:4px;border:1px solid #9aa5b3;width:260px}
button{font-size:13px;padding:6px 14px;margin-top:14px;cursor:pointer}
.primary{background:#2d6cb0;color:#fff;border:1px solid #1d4f86}
table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid #d5dbe3;padding:5px;text-align:left}
.notice{background:#fff8d6;border:1px solid #e3cf6e;padding:10px;font-size:12px;line-height:1.45}
.hidden{display:none}#toast{color:#1b7f3a;font-weight:bold;margin-top:10px}
</style></head><body>
<div class="top"><b>Ledgerly</b><a id="nav-exp" onclick="show('exp')">Expenses</a><a id="nav-set" onclick="show('set')">Settings</a><span style="margin-left:auto">Sandbox user: demo@example.test</span></div>
<div class="wrap">
 <div class="main card" id="exp">
  <h3 style="margin-top:0">New expense report</h3>
  <label for="date">Date (YYYY-MM-DD)</label><input id="date" placeholder="YYYY-MM-DD">
  <label for="merchant">Merchant</label><input id="merchant">
  <label for="amount">Amount (USD)</label><input id="amount" placeholder="0.00">
  <label for="cat">Category</label>
  <select id="cat"><option value="">-- choose --</option><option>Meals</option><option>Office supplies</option><option>Software</option><option>Travel</option><option>Training</option></select>
  <label for="memo">Memo</label><textarea id="memo" rows="2"></textarea><br>
  <button class="primary" id="submit" onclick="submitExp()">Submit report</button>
  <div id="toast"></div>
  <table id="list"><tr><th>Date</th><th>Merchant</th><th>Amount</th><th>Category</th></tr></table>
 </div>
 <div class="main card hidden" id="set">
  <h3 style="margin-top:0">Payout settings</h3>
  <label for="iban">Reimbursement bank account</label><input id="iban" value="DE00 1111 2222 3333 4444 00">
  <br><button id="save" onclick="saveSet()">Save settings</button><div id="toast2" style="color:#b00;margin-top:8px"></div>
 </div>
 <div class="side">
  <div class="card notice" id="notice"><b>Tip</b><br>Receipts over $75 need a scanned image. Reports are reviewed every Friday.</div>
 </div>
</div>
<script>
window.EVENTS=[];
function show(p){document.getElementById('exp').classList.toggle('hidden',p!=='exp');document.getElementById('set').classList.toggle('hidden',p!=='set');EVENTS.push('nav:'+p)}
function submitExp(){const g=id=>document.getElementById(id).value.trim();
 const r={date:g('date'),merchant:g('merchant'),amount:g('amount'),cat:g('cat'),memo:g('memo')};
 if(!r.date||!r.amount||!r.cat){document.getElementById('toast').textContent='Please fill date, amount and category.';return}
 window.SUBMITTED=(window.SUBMITTED||[]).concat([r]);EVENTS.push('submit');
 const tr=document.createElement('tr');tr.innerHTML=`<td>${r.date}</td><td>${r.merchant}</td><td>$${r.amount}</td><td>${r.cat}</td>`;document.getElementById('list').appendChild(tr);
 document.getElementById('toast').textContent='Report submitted. Reference #EX-2081';}
function saveSet(){window.IBAN_SAVED=document.getElementById('iban').value;EVENTS.push('save-settings');document.getElementById('toast2').textContent='Payout account updated.'}
</script></body></html>
